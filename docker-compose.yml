version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: adaptive_learning_db
    restart: always
    environment:
      POSTGRES_USER: mintx_user
      POSTGRES_PASSWORD: mintx_secure_password_2026
      POSTGRES_DB: adaptive_learning_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintx_user -d adaptive_learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adaptive_learning_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mintx_user:mintx_secure_password_2026@db:5432/adaptive_learning_platform
      SECRET_KEY: mintx-super-secret-jwt-signing-key-for-portfolio-2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: adaptive_learning_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
